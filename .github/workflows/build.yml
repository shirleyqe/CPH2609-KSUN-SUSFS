name: Build CPH2609 KSUN SUSFS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          timeout 300 sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lld llvm lz4 pahole patch python3 rsync unzip \
            xz-utils zip zstd

      - name: Fetch pinned sources
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8550_u_14.0.0_oneplus_12r \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8550.git \
            kernel_platform/common
          test "$(git -C kernel_platform/common rev-parse HEAD)" = \
            ce4627cedf3e4aac93ad0b369f623efa057707fe
          git clone --filter=blob:none --no-checkout \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8550.git \
            oneplus_vendor
          git -C oneplus_vendor sparse-checkout set vendor/oplus
          git -C oneplus_vendor checkout \
            6ada53700a567e0b92cebebccb49b74db720f96a
          ln -s "$PWD/oneplus_vendor/vendor" vendor
          mkdir -p prebuilts/clang/host/linux-x86/clang-r450784d
          curl --fail --location --retry 3 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-qpr3-release/clang-r450784d.tar.gz \
            | tar -xz -C prebuilts/clang/host/linux-x86/clang-r450784d
          test -x prebuilts/clang/host/linux-x86/clang-r450784d/bin/clang

      - name: Integrate KernelSU Next
        working-directory: kernel_platform
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.1.0-legacy-susfs/kernel/setup.sh \
            | bash -s v3.1.0-legacy-susfs
           test "$(git -C KernelSU-Next rev-parse HEAD)" = \
             ba4422f0556e10f40dda1887631d87a18ede4ec5
          python3 - <<'PY'
          if True:
           from pathlib import Path

           root = Path("KernelSU-Next/kernel")

           def replace(path, old, new, label):
               file = root / path
               text = file.read_text(encoding="utf-8")
               if text.count(old) != 1:
                   raise SystemExit(f"unexpected {label} replacement count")
               file.write_text(text.replace(old, new), encoding="utf-8")

           replace(
               "ksud.c",
               "static struct work_struct __maybe_unused stop_input_hook_work;\n#else",
               "static struct work_struct __maybe_unused stop_input_hook_work;\n"
               "bool ksu_init_rc_hook __read_mostly = true;\n"
               "bool ksu_input_hook __read_mostly = true;\n#else",
               "Kprobes hook compatibility variables",
           )
           replace(
               "ksud.c",
               "pr_info(\"unregister init_rc_hook kprobe: %d!\\n\", ret);",
               "pr_info(\"unregister init_rc_hook kprobe: %d!\\n\", ret);\n"
               "    ksu_init_rc_hook = false;",
               "init rc compatibility state",
           )
           replace(
               "ksud.c",
               "pr_info(\"unregister input kprobe: %d\\n\", ret);",
               "pr_info(\"unregister input kprobe: %d\\n\", ret);\n"
               "    ksu_input_hook = false;",
               "input compatibility state",
           )

           replace(
               "kernel_umount.h",
               "#if !defined(CONFIG_KSU_SUSFS) || !defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n"
               " // Handler function to be called from setresuid hook\n"
               " int ksu_handle_umount(uid_t old_uid, uid_t new_uid);\n"
               "#endif\n",
               " // Handler function to be called from setresuid hook\n"
               " int ksu_handle_umount(uid_t old_uid, uid_t new_uid);\n",
               "kernel_umount.h handler guard",
           )
           replace(
               "kernel_umount.c",
               "#if !defined(CONFIG_KSU_SUSFS) || !defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n"
               "static void umount_tw_func(struct callback_head *cb)",
               "static void umount_tw_func(struct callback_head *cb)",
               "kernel_umount.c handler guard",
           )
           replace(
               "kernel_umount.c",
               "#endif // #if defined(CONFIG_KSU_SUSFS) || !defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n\n"
               "void ksu_kernel_umount_init(void)",
               "void ksu_kernel_umount_init(void)",
               "kernel_umount.c handler footer",
           )

           replace(
               "setuid_hook.c",
               "extern void susfs_run_sus_path_loop(uid_t uid);",
               "extern void susfs_run_sus_path_loop(void);",
               "setuid path declaration",
           )
           for old in (
               "extern void susfs_reorder_mnt_id(void);\n",
               "extern void susfs_try_umount(uid_t uid);\n",
               "    susfs_reorder_mnt_id();\n",
           ):
               replace("setuid_hook.c", old, "", "setuid deprecated declaration/call")
           replace(
               "setuid_hook.c",
               "    susfs_try_umount(new_uid);",
               "    ksu_handle_umount(old_uid, new_uid);",
               "setuid umount handler",
           )
           replace(
               "setuid_hook.c",
               "    susfs_run_sus_path_loop(new_uid);",
               "    susfs_run_sus_path_loop();",
               "setuid path loop call",
           )

           replace(
               "supercalls.c",
               "\n".join([
                   "        if (cmd == CMD_SUSFS_SET_ANDROID_DATA_ROOT_PATH) {",
                   "            susfs_set_i_state_on_external_dir(arg);",
                   "            return 0;",
                   "        }",
                   "        if (cmd == CMD_SUSFS_SET_SDCARD_ROOT_PATH) {",
                   "            susfs_set_i_state_on_external_dir(arg);",
                   "            return 0;",
                   "        }",
               ]) + "\n",
               "",
               "deprecated SUSFS path handlers",
           )
           replace(
               "supercalls.c",
               "\n".join([
                   "#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT",
                   "        if (cmd == CMD_SUSFS_ADD_TRY_UMOUNT) {",
                   "            susfs_add_try_umount(arg);",
                   "            return 0;",
                   "        }",
                   "#endif //#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT",
               ]) + "\n",
               "",
               "deprecated SUSFS try_umount handler",
           )
          PY
           if grep -REq \
             'susfs_try_umount|susfs_reorder_mnt_id|susfs_set_i_state_on_external_dir|susfs_add_try_umount' \
             KernelSU-Next/kernel/setuid_hook.c KernelSU-Next/kernel/supercalls.c; then
             echo "deprecated SUSFS command handler remains in KernelSU-Next"
             exit 1
           fi

      - name: Integrate SUSFS
        run: |
          git clone --branch gki-android13-5.15 \
            https://github.com/ShirkNeko/susfs4ksu.git \
            kernel_platform/susfs4ksu
          git -C kernel_platform/susfs4ksu checkout \
            ccb1918684b27644d17a6c842f57b60ae5966025
          test "$(git -C kernel_platform/susfs4ksu rev-parse HEAD)" = \
            ccb1918684b27644d17a6c842f57b60ae5966025
          test -f kernel_platform/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch
          test -f kernel_platform/susfs4ksu/kernel_patches/fs/susfs.c
          test -f kernel_platform/susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f kernel_platform/susfs4ksu/kernel_patches/include/linux/susfs_def.h
          cp kernel_platform/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch \
            kernel_platform/common/
          cp kernel_platform/susfs4ksu/kernel_patches/fs/* kernel_platform/common/fs/
           cp kernel_platform/susfs4ksu/kernel_patches/include/linux/* \
             kernel_platform/common/include/linux/
          python3 - kernel_platform/common/fs/susfs.c <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "static void susfs_run_sus_path_loop(void)"
          if text.count(old) != 1:
              raise SystemExit("unexpected SUSFS path-loop definition")
          path.write_text(text.replace(old, "void susfs_run_sus_path_loop(void)"),
                          encoding="utf-8")
          PY
          python3 - kernel_platform/common/drivers/soc/oplus/sensor/oplus_sensor_devinfo.c <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = '#include "oplus_sensor_devinfo.h"\n'
          fallback = (marker +
                      "\n#ifndef CONFIG_OPLUS_FEATURE_OPROJECT\n"
                      "unsigned int __weak get_project(void)\n"
                      "{\n"
                      "\treturn 0;\n"
                      "}\n"
                      "EXPORT_SYMBOL(get_project);\n"
                      "#endif\n")
          if text.count(marker) != 1:
              raise SystemExit("unexpected Oplus sensor header")
          path.write_text(text.replace(marker, fallback), encoding="utf-8")
          PY
          SUSFS_PATCH=kernel_platform/common/50_add_susfs_in_gki-android13-5.15.patch
          ADAPTED_PATCH="$RUNNER_TEMP/50_add_susfs_in_gki-android13-5.15-oneplus.patch"
          python3 - "$SUSFS_PATCH" "$ADAPTED_PATCH" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          text = source.read_text(encoding="utf-8")

          def remove_between(value, start, end, label):
              if value.count(start) != 1 or value.count(end) != 1:
                  raise SystemExit(f"unexpected SUSFS {label} hunk boundary")
              begin = value.index(start)
              finish = value.index(end, begin)
              return value[:begin] + value[finish:]

          def replace_exact(value, old, new, expected, label):
              if value.count(old) != expected:
                  raise SystemExit(f"unexpected SUSFS {label} replacement count")
              return value.replace(old, new)

          for path in (
              "drivers/input/input.c",
              "fs/read_write.c",
              "security/selinux/hooks.c",
              "security/selinux/selinuxfs.c",
          ):
              start = f"diff --git a/{path} b/{path}\n"
              if text.count(start) != 1:
                  raise SystemExit(f"unexpected SUSFS {path} patch count")
              begin = text.index(start)
              finish = text.find("diff --git ", begin + len(start))
              if finish < 0:
                  finish = len(text)
              text = text[:begin] + text[finish:]

          text = remove_between(
              text,
              "@@ -171,6 +195,13 @@ EXPORT_SYMBOL_NS(vfs_getattr, ANDROID_GKI_VFS_EXPORT_ONLY);\n",
              "@@ -180,10 +211,24 @@ int vfs_fstat(int fd, struct kstat *stat)\n",
              "fs/stat.c fstat declaration")
          text = remove_between(
              text,
              "@@ -180,10 +211,24 @@ int vfs_fstat(int fd, struct kstat *stat)\n",
              "@@ -206,6 +251,18 @@ static int vfs_statx(int dfd, const char __user *filename, int flags,\n",
              "fs/stat.c fstat hook")
          tab = chr(9)
          stat_declarations = "\n".join([
              "+#ifdef CONFIG_KSU_SUSFS",
              "+" + tab + "extern bool ksu_su_compat_enabled;",
              "+" + tab + "extern bool __ksu_is_allow_uid_for_current(uid_t uid);",
              "+#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)",
              "+" + tab + "extern int ksu_handle_stat(int *dfd, struct filename **filename, int *flags);",
              "+#else",
              "+" + tab + "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);",
              "+#endif",
              "+#endif",
              "+",
          ]) + "\n"
          stat_marker = " \tint error;\n \n+#ifdef CONFIG_KSU_SUSFS\n+" + tab + "if (likely(susfs_is_current_proc_umounted()))"
          if text.count(stat_marker) != 1:
              raise SystemExit("unexpected SUSFS fs/stat.c statx hunk")
          stat_prefix = " \tint error;\n \n"
          text = text.replace(stat_marker, stat_prefix + stat_declarations + stat_marker[len(stat_prefix):])
          text = replace_exact(
              text,
              "@@ -206,6 +251,18 @@ static int vfs_statx(int dfd, const char __user *filename, int flags,\n",
              "@@ -206,6 +251,28 @@ static int vfs_statx(int dfd, const char __user *filename, int flags,\n",
              1,
              "fs/stat.c statx hunk size")
          text = replace_exact(
              text,
              "+extern struct static_key_true ksu_su_compat_enabled;\n",
              "+extern bool ksu_su_compat_enabled;\n",
              2,
              "sucompat declaration")
          text = replace_exact(
              text,
              "+\tif (static_branch_likely(&ksu_su_compat_enabled))",
              "+\tif (ksu_su_compat_enabled)",
              3,
              "sucompat branch")
          if any(symbol in text for symbol in (
              "ksu_is_init_rc_hook_enabled",
              "ksu_is_input_hook_enabled",
              "ksu_handle_vfs_fstat",
              "ksu_selinux_hide_running",
              "fake_status_initialize_key",
          )):
              raise SystemExit("incompatible legacy KernelSU SUSFS symbol remains")

          memory_old = "\n".join([
              "@@ -74,6 +74,9 @@",
              " #include <linux/perf_event.h>",
              " #include <linux/ptrace.h>",
              " #include <linux/vmalloc.h>",
              "+#ifdef CONFIG_KSU_SUSFS_SUS_MAP",
              "+#include <linux/susfs_def.h>",
              "+#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP",
              " #include <trace/hooks/mm.h>",
              " ",
              " #include <trace/events/kmem.h>",
          ]) + "\n"
          memory_new = "\n".join([
              "@@ -76,1 +76,4 @@",
              "-#include <linux/swap_slots.h>",
              "+#include <linux/swap_slots.h>",
              "+#ifdef CONFIG_KSU_SUSFS_SUS_MAP",
              "+#include <linux/susfs_def.h>",
              "+#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP",
          ]) + "\n"
          namei_old = "\n".join([
              "@@ -1565,6 +1590,17 @@ struct dentry *lookup_one_qstr_excl(const struct qstr *name,",
              " \t\tdput(dentry);",
              " \t\tdentry = old;",
              " \t}",
              "+#ifdef CONFIG_KSU_SUSFS_SUS_PATH",
              "+\tif (unlikely(dentry) && !IS_ERR(dentry) && dentry->d_inode && !found_sus_path && susfs_is_inode_sus_path(dentry->d_inode)) {",
              "+\t\tif (d_in_lookup(dentry))",
              "+\t\t\td_lookup_done(dentry);",
              "+\t\tif (!(flags & LOOKUP_RCU))",
              "+\t\t\tdput(dentry);",
              "+\t\tdentry = d_alloc(base, &susfs_fake_qstr_name);",
              "+\t\tfound_sus_path = true;",
              "+\t\tgoto retry;",
              "+\t}",
              "+#endif",
              " \treturn dentry;",
              " }",
              " EXPORT_SYMBOL(lookup_one_qstr_excl);",
          ]) + "\n"
          namei_new = "\n".join([
              "@@ -1566,1 +1566,12 @@ struct dentry *lookup_one_qstr_excl(const struct qstr *name,",
              "-\t\tdentry = old;",
              "+\t\tdentry = old;",
              "+#ifdef CONFIG_KSU_SUSFS_SUS_PATH",
              "+\tif (unlikely(dentry) && !IS_ERR(dentry) && dentry->d_inode && !found_sus_path && susfs_is_inode_sus_path(dentry->d_inode)) {",
              "+\t\tif (d_in_lookup(dentry))",
              "+\t\t\td_lookup_done(dentry);",
              "+\t\tif (!(flags & LOOKUP_RCU))",
              "+\t\t\tdput(dentry);",
              "+\t\tdentry = d_alloc(base, &susfs_fake_qstr_name);",
              "+\t\tfound_sus_path = true;",
              "+\t\tgoto retry;",
              "+\t}",
              "+#endif",
          ]) + "\n"
          task_old = "\n".join([
              "@@ -857,6 +895,13 @@ static int show_smap(struct seq_file *m, void *v)",
              " \tstruct vm_area_struct *vma = v;",
              " \tstruct mem_size_stats mss;",
              " ",
              "+#ifdef CONFIG_KSU_SUSFS_SUS_MAP",
              "+\tif (vma->vm_file) {",
              "+\t\tif (SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))",
              "+\t\t\treturn 0;",
              "+\t}",
              "+#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP",
              "+",
              " \tmemset(&mss, 0, sizeof(mss));",
              " ",
              " \tif (!vma_pages(vma))",
          ]) + "\n"
          task_new = "\n".join([
              "@@ -860,1 +860,8 @@ static int show_smap(struct seq_file *m, void *v)",
              "-\tmemset(&mss, 0, sizeof(mss));",
              "+\tmemset(&mss, 0, sizeof(mss));",
              "+#ifdef CONFIG_KSU_SUSFS_SUS_MAP",
              "+\tif (vma->vm_file) {",
              "+\t\tif (SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))",
              "+\t\t\treturn 0;",
              "+\t}",
              "+#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP",
              "+",
          ]) + "\n"
          replacements = [
              ("memory.c", memory_old, memory_new),
              ("namei.c", namei_old, namei_new),
              ("task_mmu.c", task_old, task_new),
          ]
          for name, old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected SUSFS {name} hunk count")
              text = text.replace(old, new)
          destination.write_text(text, encoding="utf-8")
          PY
          patch --batch --fuzz=0 --no-backup-if-mismatch \
            -d kernel_platform/common -p1 \
            < "$ADAPTED_PATCH"
          test -z "$(find kernel_platform/common -name '*.rej' -print -quit)"
          grep -q '#include <linux/susfs_def.h>' kernel_platform/common/mm/memory.c
          grep -q 'CONFIG_KSU_SUSFS_SUS_MAP' kernel_platform/common/mm/memory.c
          python3 - kernel_platform/common/fs/proc/task_mmu.c <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          include = "#include <linux/susfs_def.h>\n"
          compatibility = (include +
                          "#ifndef VMA_PAD_START\n"
                          "#define VMA_PAD_START(vma) (vma->vm_end)\n"
                          "#endif\n")
          if text.count(include) != 1:
              raise SystemExit("unexpected task_mmu.c SUSFS include count")
          path.write_text(text.replace(include, compatibility), encoding="utf-8")
          PY
          grep -q '#define VMA_PAD_START' kernel_platform/common/fs/proc/task_mmu.c
          test -z "$(find kernel_platform/common -name '*.rej' -print -quit)"

      - name: Build kernel
        run: |
          export KERNEL_DIR="$PWD/kernel_platform/common"
          export OUT_DIR="$PWD/out"
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784d/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          make -C "$KERNEL_DIR" O="$OUT_DIR" gki_defconfig
          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            --enable KSU --enable KSU_SUSFS \
            --disable LTO_CLANG_FULL --enable LTO_CLANG_THIN \
            --enable QCOM_SMEM --disable OPLUS_FEATURE_OPROJECT
          make -C "$KERNEL_DIR" O="$OUT_DIR" olddefconfig
          make -C "$KERNEL_DIR" O="$OUT_DIR" -j"$(nproc)" Image
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LTO_CLANG_THIN=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_QCOM_SMEM=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_OPLUS_FEATURE_OPROJECT is not set$' "$OUT_DIR/.config"
          test -s "$OUT_DIR/vmlinux"
          test -s "$OUT_DIR/System.map"
          strings "$OUT_DIR/vmlinux" > "$RUNNER_TEMP/vmlinux.strings"
          grep -q KernelSU "$RUNNER_TEMP/vmlinux.strings"
          grep -qi SUSFS "$RUNNER_TEMP/vmlinux.strings"
          grep -Eq ' [Tt] susfs_init$' "$OUT_DIR/System.map"
          grep -Eq ' [Tt] (susfs_add_sus_path|susfs_get_enabled_features)$' \
            "$OUT_DIR/System.map"
          {
            echo "Image size: $(stat -c '%s' "$OUT_DIR/arch/arm64/boot/Image")"
            sha256sum "$OUT_DIR/arch/arm64/boot/Image"
            grep -E '^CONFIG_(KSU|KSU_SUSFS|KSU_SUSFS_SUS_PATH|KSU_SUSFS_TRY_UMOUNT)=y$' \
              "$OUT_DIR/.config"
            grep -E '^CONFIG_LTO_CLANG_THIN=y$' "$OUT_DIR/.config"
            grep -E '^CONFIG_QCOM_SMEM=y$|^# CONFIG_OPLUS_FEATURE_OPROJECT is not set$' \
              "$OUT_DIR/.config"
            echo "vmlinux strings:"
            grep -E -i -m 20 'kernelsu|susfs' "$RUNNER_TEMP/vmlinux.strings"
            echo "System.map symbols:"
            grep -E ' [Tt] (susfs_init|susfs_add_sus_path|susfs_get_enabled_features)$' \
              "$OUT_DIR/System.map"
          } | tee "$OUT_DIR/verification.txt"

      - name: Archive verified kernel
        uses: actions/upload-artifact@v4
        with:
          name: CPH2609-OOS14-KSUN-SUSFS-kernel
          if-no-files-found: error
          retention-days: 7
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/System.map
            out/vmlinux
            out/verification.txt
