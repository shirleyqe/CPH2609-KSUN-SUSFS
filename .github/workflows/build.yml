name: Build CPH2609 GKI KSUN SUSFS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          timeout 300 sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lld llvm lz4 pahole patch python3 rsync unzip \
            xz-utils zip zstd

      - name: Fetch Google ACK 5.15 GKI source
        run: |
          mkdir -p kernel_platform
          git clone --depth 50 \
            --branch android13-5.15 \
            https://android.googlesource.com/kernel/common \
            kernel_platform/common
          mkdir -p prebuilts/clang/host/linux-x86/clang-r450784e
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 1500 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r450784e.tar.gz \
            | tar -xz -C prebuilts/clang/host/linux-x86/clang-r450784e
          test -x prebuilts/clang/host/linux-x86/clang-r450784e/bin/clang
          prebuilts/clang/host/linux-x86/clang-r450784e/bin/clang --version \
            | tee "$RUNNER_TEMP/clang-version.txt"
          grep -F 'r450784e' "$RUNNER_TEMP/clang-version.txt"
          grep -E 'clang version 14\.0\.7' "$RUNNER_TEMP/clang-version.txt"

      - name: Check runner specs and add swap
        run: |
          nproc
          free -h
          df -h /
          if ! swapon --show | grep -q /swapfile2; then
            sudo fallocate -l 12G /swapfile2
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2
          fi
          free -h
          df -h /

      - name: Integrate KernelSU Next
        working-directory: kernel_platform/common
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.1.0-legacy-susfs/kernel/setup.sh \
            | bash -s v3.1.0-legacy-susfs
          test -d KernelSU-Next
          test "$(git -C KernelSU-Next rev-parse HEAD)" = \
            ba4422f0556e10f40dda1887631d87a18ede4ec5
          python3 - <<'PY'
          from pathlib import Path
          root = Path("KernelSU-Next/kernel")

          def replace(path, old, new, label):
              file = root / path
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected {label} replacement count")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "kernel_umount.h",
              "#if !defined(CONFIG_KSU_SUSFS) || !defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n"
              " // Handler function to be called from setresuid hook\n"
              " int ksu_handle_umount(uid_t old_uid, uid_t new_uid);\n"
              "#endif\n",
              " // Handler function to be called from setresuid hook\n"
              " int ksu_handle_umount(uid_t old_uid, uid_t new_uid);\n",
              "kernel_umount.h handler guard",
          )
          replace(
              "setuid_hook.c",
              "extern void susfs_run_sus_path_loop(uid_t uid);",
              "extern void susfs_run_sus_path_loop(void);",
              "setuid path declaration",
          )
          for old in (
              "extern void susfs_reorder_mnt_id(void);\n",
              "extern void susfs_try_umount(uid_t uid);\n",
              "    susfs_reorder_mnt_id();\n",
          ):
              replace("setuid_hook.c", old, "", "setuid deprecated declaration/call")
          replace(
              "setuid_hook.c",
              "    susfs_try_umount(new_uid);",
              "    ksu_handle_umount(old_uid, new_uid);",
              "setuid umount handler",
          )
          replace(
              "setuid_hook.c",
              "    susfs_run_sus_path_loop(new_uid);",
              "    susfs_run_sus_path_loop();",
              "setuid path loop call",
          )
          replace(
              "supercalls.c",
              "\n".join([
                  "        if (cmd == CMD_SUSFS_SET_ANDROID_DATA_ROOT_PATH) {",
                  "            susfs_set_i_state_on_external_dir(arg);",
                  "            return 0;",
                  "        }",
                  "        if (cmd == CMD_SUSFS_SET_SDCARD_ROOT_PATH) {",
                  "            susfs_set_i_state_on_external_dir(arg);",
                  "            return 0;",
                  "        }",
              ]) + "\n",
              "",
              "deprecated SUSFS path handlers",
          )
          replace(
              "supercalls.c",
              "\n".join([
                  "#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT",
                  "        if (cmd == CMD_SUSFS_ADD_TRY_UMOUNT) {",
                  "            susfs_add_try_umount(arg);",
                  "            return 0;",
                  "        }",
                  "#endif //#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT",
              ]) + "\n",
              "",
              "deprecated SUSFS try_umount handler",
          )
          PY
          if grep -REq \
            'susfs_try_umount|susfs_reorder_mnt_id|susfs_set_i_state_on_external_dir|susfs_add_try_umount' \
            KernelSU-Next/kernel/setuid_hook.c KernelSU-Next/kernel/supercalls.c; then
            echo "deprecated SUSFS command handler remains in KernelSU-Next"
            exit 1
          fi

      - name: Integrate SUSFS
        run: |
          git clone --branch gki-android13-5.15 \
            https://github.com/ShirkNeko/susfs4ksu.git \
            kernel_platform/susfs4ksu
          git -C kernel_platform/susfs4ksu checkout \
            ccb1918684b27644d17a6c842f57b60ae5966025
          test "$(git -C kernel_platform/susfs4ksu rev-parse HEAD)" = \
            ccb1918684b27644d17a6c842f57b60ae5966025
          test -f kernel_platform/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch
          test -f kernel_platform/susfs4ksu/kernel_patches/fs/susfs.c
          test -f kernel_platform/susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f kernel_platform/susfs4ksu/kernel_patches/include/linux/susfs_def.h
          cp kernel_platform/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch \
            kernel_platform/common/
          cp kernel_platform/susfs4ksu/kernel_patches/fs/* kernel_platform/common/fs/
          cp kernel_platform/susfs4ksu/kernel_patches/include/linux/* \
            kernel_platform/common/include/linux/
          python3 - kernel_platform/common/fs/susfs.c <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "static void susfs_run_sus_path_loop(void)"
          if text.count(old) != 1:
              raise SystemExit("unexpected SUSFS path-loop definition")
          path.write_text(text.replace(old, "void susfs_run_sus_path_loop(void)"),
                          encoding="utf-8")
          PY
          patch --batch --fuzz=0 --no-backup-if-mismatch \
            -d kernel_platform/common -p1 \
            < kernel_platform/common/50_add_susfs_in_gki-android13-5.15.patch
          test -z "$(find kernel_platform/common -name '*.rej' -print -quit)"
          grep -q '#include <linux/susfs_def.h>' kernel_platform/common/mm/memory.c
          grep -q 'CONFIG_KSU_SUSFS_SUS_MAP' kernel_platform/common/mm/memory.c

      - name: Configure GKI Kernel
        run: |
          export KERNEL_DIR="$PWD/kernel_platform/common"
          export OUT_DIR="$PWD/out"
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          mkdir -p "$OUT_DIR"
          make -C "$KERNEL_DIR" O="$OUT_DIR" gki_defconfig
          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            --enable KSU \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_TRY_UMOUNT \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --disable TRIM_UNUSED_KSYMS \
            --undefine UNUSED_KSYMS_WHITELIST \
            --set-str LOCALVERSION "-android13-8-00760-gf490405820f7" \
            --disable LOCALVERSION_AUTO
          : > "$KERNEL_DIR/.scmversion"
          make -C "$KERNEL_DIR" O="$OUT_DIR" olddefconfig
          grep -q '^CONFIG_KSU=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SUS_MAP=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LTO_CLANG_FULL=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_IKCONFIG=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_IKCONFIG_PROC=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_TRIM_UNUSED_KSYMS is not set$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LOCALVERSION="-android13-8-00760-gf490405820f7"$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' "$OUT_DIR/.config"

      - name: Build kernel Image
        run: |
          export KERNEL_DIR="$PWD/kernel_platform/common"
          export OUT_DIR="$PWD/out"
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export LOCALVERSION=""
          export KBUILD_BUILD_VERSION=1
          make -C "$KERNEL_DIR" O="$OUT_DIR" -j"$(nproc)" Image
          test -s "$OUT_DIR/arch/arm64/boot/Image"

      - name: Verify kernel Image and symbols
        run: |
          export OUT_DIR="$PWD/out"
          test -s "$OUT_DIR/vmlinux"
          test -s "$OUT_DIR/System.map"
          KERNEL_RELEASE="$(cat "$OUT_DIR/include/config/kernel.release")"
          echo "kernel.release: $KERNEL_RELEASE"
          test "$KERNEL_RELEASE" = "5.15.123-android13-8-00760-gf490405820f7"
          grep -q '#define UTS_RELEASE "5.15.123-android13-8-00760-gf490405820f7"' "$OUT_DIR/include/generated/utsrelease.h"
          strings "$OUT_DIR/vmlinux" > "$RUNNER_TEMP/vmlinux.strings"
          grep -q KernelSU "$RUNNER_TEMP/vmlinux.strings"
          grep -qi SUSFS "$RUNNER_TEMP/vmlinux.strings"
          grep -Eq ' [Tt] susfs_init$' "$OUT_DIR/System.map"
          grep -Eq ' [Tt] (susfs_add_sus_path|susfs_get_enabled_features)$' \
            "$OUT_DIR/System.map"
          CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin/clang"
          CLANG_VER="$("$CLANG_PATH" --version | head -n1)"
          IMAGE_SIZE="$(stat -c '%s' "$OUT_DIR/arch/arm64/boot/Image")"
          IMAGE_SHA="$(sha256sum "$OUT_DIR/arch/arm64/boot/Image" | awk '{print $1}')"
          {
            echo "variant=GKI_ACK_5.15_KSUN_SUSFS"
            echo "device=CPH2609"
            echo "firmware=CPH2609_14.0.0.810(EX01)"
            echo "kernel_tree=Google ACK android13-5.15"
            echo "ksun=v3.1.0-legacy-susfs@ba4422f0556e10f40dda1887631d87a18ede4ec5"
            echo "susfs=gki-android13-5.15@ccb1918684b27644d17a6c842f57b60ae5966025"
            echo "uts_release=$KERNEL_RELEASE"
            echo "config_base=gki_defconfig"
            echo "config_delta=KSU=y KSU_SUSFS=y TRIM_UNUSED_KSYMS=n LOCALVERSION=-android13-8-00760-gf490405820f7"
            echo "lto=full"
            echo "clang_path=$CLANG_PATH"
            echo "clang_version=$CLANG_VER"
            echo "image_size=$IMAGE_SIZE"
            echo "image_sha256=$IMAGE_SHA"
            echo "git_commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } | tee "$OUT_DIR/provenance.txt"

      - name: Compress vmlinux
        run: |
          mkdir -p out/vmlinux-dist
          zip -9 out/vmlinux-dist/vmlinux.zip out/vmlinux
          test -s out/vmlinux-dist/vmlinux.zip

      - name: Archive kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: CPH2609-810-GKI-KSUN-SUSFS-kernel
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/System.map
            out/provenance.txt
            out/include/config/kernel.release
            out/include/generated/utsrelease.h

      - name: Archive compressed vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: CPH2609-810-GKI-KSUN-SUSFS-vmlinux
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            out/vmlinux-dist/vmlinux.zip
