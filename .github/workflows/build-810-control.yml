name: Build CPH2609 810 CONTROL (no KSU/SUSFS)

on:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          timeout 300 sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lld llvm lz4 pahole patch python3 rsync unzip \
            xz-utils zip zstd

      - name: Fetch pinned sources
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8550_u_14.0.0_oneplus_12r \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8550.git \
            kernel_platform/common
          test "$(git -C kernel_platform/common rev-parse HEAD)" = \
            ce4627cedf3e4aac93ad0b369f623efa057707fe
          git clone --filter=blob:none --no-checkout \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8550.git \
            oneplus_vendor
          git -C oneplus_vendor sparse-checkout set vendor/oplus
          git -C oneplus_vendor checkout \
            6ada53700a567e0b92cebebccb49b74db720f96a
          ln -s "$PWD/oneplus_vendor/vendor" vendor
          mkdir -p prebuilts/clang/host/linux-x86/clang-r450784e
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 1500 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r450784e.tar.gz \
            | tar -xz -C prebuilts/clang/host/linux-x86/clang-r450784e
          test -x prebuilts/clang/host/linux-x86/clang-r450784e/bin/clang
          prebuilts/clang/host/linux-x86/clang-r450784e/bin/clang --version \
            | tee "$RUNNER_TEMP/clang-version.txt"
          # Must be the real r450784e package (stock .810 toolchain id), not r450784d.
          grep -F 'r450784e' "$RUNNER_TEMP/clang-version.txt"
          grep -E 'clang version 14\.0\.7' "$RUNNER_TEMP/clang-version.txt"

      - name: Check runner specs and add swap
        run: |
          nproc
          free -h
          df -h /
          if ! swapon --show | grep -q /swapfile2; then
            sudo fallocate -l 12G /swapfile2
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2
          fi
          free -h
          df -h /

      - name: CONTROL config (stock .810 IKCONFIG, NO fragment, NO KSU/SUSFS, CONTROL-V2 alignment)
        run: |
          export KERNEL_DIR="$PWD/kernel_platform/common"
          export OUT_DIR="$PWD/out"
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          # CONTROL-V2: stock .810 OEM IKCONFIG as the ONLY config base.
          # Deliberately NOT merging kalama_GKI.config and NOT integrating
          # KernelSU/SUSFS at all.
          mkdir -p "$OUT_DIR"
          cp "$GITHUB_WORKSPACE/stock-config/stock_config_810.txt" \
            "$OUT_DIR/.config"
          grep -q '^CONFIG_LTO_CLANG_FULL=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_IKCONFIG=y$' "$OUT_DIR/.config"
          grep -q '^CONFIG_IKCONFIG_PROC=y$' "$OUT_DIR/.config"
          # Classified delta: TRIM=n exports superset so vendor modules load.
          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            --disable TRIM_UNUSED_KSYMS \
            --undefine UNUSED_KSYMS_WHITELIST
          # CONTROL-V2 Requirement 1: Exact UTS alignment to stock .810
          # Stock uts_release = 5.15.123-android13-8-00760-gf490405820f7
          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            --set-str LOCALVERSION "-android13-8-00760-gf490405820f7" \
            --disable LOCALVERSION_AUTO
          make -C "$KERNEL_DIR" O="$OUT_DIR" olddefconfig
          # CONTROL-V2 Requirement 2: Explicitly disable the 7 vendor-injected
          # control-only =y features plus OPLUS_CHG =m and OPLUS_FEATURE_SENSOR_CFG =n.
          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            --disable OPLUS_FEATURE_SENSOR_CFG \
            --disable HORAE_THERMAL_SHELL \
            --disable DYNAMIC_TUNING_SWAPPINESS \
            --disable OPLUS_FEATURE_PERFORMANCE_MM \
            --disable OPLUS_FEATURE_PERFORMANCE_SCHED \
            --disable OPLUS_FEATURE_WINDOW_POLICY \
            --disable OPLUS_SYSTEM_KERNEL \
            --disable OPLUS_SYSTEM_KERNEL_QCOM \
            --disable OPLUS_CHG
          # Suppress git trailing '+' in setlocalversion
          : > "$KERNEL_DIR/.scmversion"
          # Assertions: all 8+1 explicitly disabled symbols must be absent/unset (=n)
          grep -q '^# CONFIG_OPLUS_FEATURE_SENSOR_CFG is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_HORAE_THERMAL_SHELL is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_DYNAMIC_TUNING_SWAPPINESS is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_OPLUS_FEATURE_PERFORMANCE_MM is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_OPLUS_FEATURE_PERFORMANCE_SCHED is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_OPLUS_FEATURE_WINDOW_POLICY is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_OPLUS_SYSTEM_KERNEL is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_OPLUS_SYSTEM_KERNEL_QCOM is not set$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_OPLUS_CHG is not set$' "$OUT_DIR/.config"
          grep -q '^CONFIG_LOCALVERSION="-android13-8-00760-gf490405820f7"$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' "$OUT_DIR/.config"
          cp "$OUT_DIR/.config" "$OUT_DIR/.config.control"
          # Gate: KernelSU/SUSFS must be completely absent.
          if grep -q '^CONFIG_KSU' "$OUT_DIR/.config"; then
            echo "KSU symbol leaked into CONTROL .config" >&2
            exit 1
          fi
          grep -q '^CONFIG_LTO_CLANG_FULL=y$' "$OUT_DIR/.config"
          grep -q '^# CONFIG_TRIM_UNUSED_KSYMS is not set$' "$OUT_DIR/.config"
          # Audit against the stock expectation (empty fragment => stock alone).
          : > "$RUNNER_TEMP/empty_frag.config"
          python3 "$GITHUB_WORKSPACE/stock-config/audit_config.py" \
            --allow-new "$GITHUB_WORKSPACE/stock-config/810-final-only-allowlist.txt" \
            "$GITHUB_WORKSPACE/stock-config/stock_config_810.txt" \
            "$RUNNER_TEMP/empty_frag.config" \
            "$OUT_DIR/.config" | tee "$OUT_DIR/config-audit.txt"

      - name: Build kernel Image
        run: |
          export KERNEL_DIR="$PWD/kernel_platform/common"
          export OUT_DIR="$PWD/out"
          export PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export LOCALVERSION=""
          export KBUILD_BUILD_VERSION=1
          make -C "$KERNEL_DIR" O="$OUT_DIR" -j"$(nproc)" Image
          test -s "$OUT_DIR/arch/arm64/boot/Image"

      - name: Verify CONTROL kernel
        run: |
          export OUT_DIR="$PWD/out"
          export CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r450784e/bin/clang"
          CLANG_VER="$("$CLANG_PATH" --version | head -n1)"
          IMAGE_SIZE="$(stat -c '%s' "$OUT_DIR/arch/arm64/boot/Image")"
          IMAGE_SHA="$(sha256sum "$OUT_DIR/arch/arm64/boot/Image" | awk '{print $1}')"
          # UTS release exact verification
          KERNEL_RELEASE="$(cat "$OUT_DIR/include/config/kernel.release")"
          echo "kernel.release: $KERNEL_RELEASE"
          test "$KERNEL_RELEASE" = "5.15.123-android13-8-00760-gf490405820f7"
          grep -q '#define UTS_RELEASE "5.15.123-android13-8-00760-gf490405820f7"' "$OUT_DIR/include/generated/utsrelease.h"
          grep -a "Linux version 5.15.123-android13-8-00760-gf490405820f7" "$OUT_DIR/vmlinux"
          grep -a "Linux version 5.15.123-android13-8-00760-gf490405820f7" "$OUT_DIR/arch/arm64/boot/Image"
          # Binary evidence: no KernelSU/SUSFS strings anywhere.
          test "$(grep -a -c 'KernelSU' "$OUT_DIR/vmlinux" || true)" = "0"
          test "$(grep -a -c -E 'susfs|KSU_SUSFS' "$OUT_DIR/vmlinux" || true)" = "0"
          test "$(grep -a -c 'KernelSU' "$OUT_DIR/arch/arm64/boot/Image" || true)" = "0"
          {
            echo "variant=CONTROL_V2"
            echo "device=CPH2609"
            echo "firmware=CPH2609_14.0.0.810(EX01)"
            echo "kernel_tree=OnePlusOSS/android_kernel_oneplus_sm8550@ce4627cedf3e4aac93ad0b369f623efa057707fe"
            echo "vendor_tree=OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8550@6ada53700a567e0b92cebebccb49b74db720f96a"
            echo "ksun=none (CONTROL-V2: no KernelSU, no SUSFS)"
            echo "uts_release=$KERNEL_RELEASE"
            echo "config_base=stock-config/stock_config_810.txt (.810 OEM IKCONFIG)"
            echo "config_fragment=none (empty; NOT kalama_GKI.config)"
            echo "config_delta=TRIM_UNUSED_KSYMS=n (stock whitelist is private jenkins path); LOCALVERSION=-android13-8-00760-gf490405820f7; LOCALVERSION_AUTO=n; 7 control-only y disabled (HORAE_THERMAL_SHELL, DYNAMIC_TUNING_SWAPPINESS, OPLUS_FEATURE_PERFORMANCE_MM, OPLUS_FEATURE_PERFORMANCE_SCHED, OPLUS_FEATURE_WINDOW_POLICY, OPLUS_SYSTEM_KERNEL, OPLUS_SYSTEM_KERNEL_QCOM); OPLUS_CHG disabled; OPLUS_FEATURE_SENSOR_CFG forced n (link fix)"
            echo "lto=full"
            echo "clang_path=$CLANG_PATH"
            echo "clang_version=$CLANG_VER"
            echo "image_size=$IMAGE_SIZE"
            echo "image_sha256=$IMAGE_SHA"
            echo "git_commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } | tee "$OUT_DIR/provenance.txt"

      - name: Archive CONTROL kernel
        uses: actions/upload-artifact@v4
        with:
          name: CPH2609-810-CONTROL-V2-kernel
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/.config.control
            out/System.map
            out/Module.symvers
            out/vmlinux
            out/config-audit.txt
            out/provenance.txt
            out/include/config/kernel.release
            out/include/generated/utsrelease.h